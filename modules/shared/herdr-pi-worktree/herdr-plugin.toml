# Linked from Home Manager. Starts Pi in a new worktree pane.
id = "nixos-config.pi-worktree"
name = "Pi in worktree"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Start Pi in Herdr worktree panes"
platforms = ["linux", "macos"]

[[actions]]
id = "start"
title = "Start Pi in pane"
contexts = ["workspace", "pane"]
command = ["./start-pi.sh"]

[[events]]
on = "worktree.created"
command = ["./start-pi.sh"]
