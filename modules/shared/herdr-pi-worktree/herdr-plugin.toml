# Linked from Home Manager. Starts Pi in a worktree pane after cd.
id = "nixos-config.pi-worktree"
name = "Pi in worktree"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "cd to the Git checkout, start Pi without --model (coordinator assigns)"
platforms = ["linux", "macos"]

[[actions]]
id = "start"
title = "Start Pi in pane"
contexts = ["workspace", "pane"]
command = ["./start-pi.sh"]

[[events]]
on = "worktree.created"
command = ["./start-pi.sh"]

[[events]]
on = "worktree.opened"
command = ["./start-pi.sh"]
